<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>力芯工艺文档更新</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #f5f7fa; color: #333; }
  header { background: #fff; padding: 15px 20px; border-bottom: 1px solid #ebebeb; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 22px; color: #0056b3; }
  .btn-admin { background: #0056b3; color: #fff; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 14px; }
  .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }
  .search-bar { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .search-bar select, .search-bar input { padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; outline: none; }
  .search-bar input { flex: 1; min-width: 200px; }
  .btn-search { background: #0056b3; color: #fff; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; }
  .btn-reset { background: #ccc; color: #333; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; }
  
  .process-item { background: #fff; padding: 15px; border-radius: 8px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; align-items: center; flex-wrap: nowrap; gap: 15px; }
  .process-item .name { font-size: 18px; font-weight: bold; color: #0056b3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 250px; }
  .process-item .info { display: flex; gap: 15px; font-size: 14px; color: #666; align-items: center; white-space: nowrap; }
  .badge-new { background: #ffebee; color: #e53935; padding: 3px 8px; border-radius: 12px; font-size: 12px; white-space: nowrap; }
  .actions { margin-left: auto; display: flex; gap: 8px; }
  .actions button { padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
  .btn-view { background: #e3f2fd; color: #1976d2; }
  .btn-edit { background: #fff8e1; color: #ff8f00; }

  /* 详情页样式 */
  .detail-header { background: #fff; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  .detail-title { font-size: 24px; font-weight: bold; color: #0056b3; margin-bottom: 10px; }
  .detail-meta { font-size: 14px; color: #666; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
  .content-area { background: #fff; padding: 20px; border-radius: 8px; min-height: 300px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
  .content-area h3 { font-size: 16px; margin-bottom: 15px; color: #333; display: flex; align-items: center; gap: 5px; }
  .empty-text { color: #aaa; text-align: right; font-style: italic; margin-top: 20px; }
  .empty-img { color: #aaa; text-align: right; margin-top: 20px; }
  
  /* 详情页底部编辑表单 */
  .detail-edit-form { background: #f9fafb; padding: 20px; border-radius: 8px; border: 1px solid #ebebeb; margin-top: 20px; }
  .detail-edit-form h4 { margin-bottom: 15px; font-size: 15px; color: #333; }
  .form-row { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
  .form-group { flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 5px; }
  .form-group label { font-size: 13px; color: #555; font-weight: bold; }
  .form-group input { padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; width: 100%; }
  .btn-save-detail { background: #0056b3; color: #fff; border: none; padding: 12px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 15px; margin-top: 10px; }
  
  .btn-back { background: #f5f7fa; border: 1px solid #ddd; padding: 8px 15px; border-radius: 4px; cursor: pointer; margin-bottom: 15px; font-size: 14px; }
  
  /* 后台面板 */
  #adminPanel { display: none; position: fixed; top: 0; right: 0; width: 100%; max-width: 400px; height: 100%; background: #fff; box-shadow: -2px 0 10px rgba(0,0,0,0.1); padding: 20px; overflow-y: auto; z-index: 1000; }
  #adminPanel h2 { margin-bottom: 20px; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
  #adminPanel .close { cursor: pointer; color: #999; font-size: 24px; }
  #adminContent .form-group { margin-bottom: 15px; }
  .btn-primary { background: #4caf50; color: #fff; border: none; padding: 12px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 15px; margin-top: 10px; }
  .btn-secondary { background: #f5f5f5; border: 1px solid #ddd; padding: 10px; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 10px; }
  .btn-danger { background: #f44336; color: #fff; border: none; padding: 12px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 15px; margin-top: 10px; }
  .btn-rename { background: #ff9800; color: #fff; border: none; padding: 12px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 15px; margin-top: 10px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  
  #alertBanner { display: none; background: #fff3cd; color: #856404; padding: 10px; text-align: center; font-size: 13px; margin-bottom: 15px; border-radius: 4px; }
</style>
</head>
<body>

<header>
  <h1>力芯工艺文档更新</h1>
  <button class="btn-admin" onclick="openAdmin()">🔒 管理员登录</button>
</header>

<div class="container">
  <div id="alertBanner">⚠️ 当前显示的是内嵌默认数据。请上传 data.json 到 GitHub 仓库根目录。</div>
  
  <div id="listView">
    <div class="search-bar">
      <select id="factoryFilter"><option value="">选择工艺厂</option></select>
      <input type="text" id="searchInput" placeholder="搜索工艺名...">
      <button class="btn-search" onclick="filterData()">搜索</button>
      <button class="btn-reset" onclick="resetFilter()">清空</button>
    </div>
    <div id="listContainer"></div>
  </div>

  <div id="detailView" style="display:none;">
    <button class="btn-back" onclick="backToList()">← 返回工艺列表</button>
    <div class="detail-header">
      <div class="detail-title" id="detailTitle"></div>
      <div class="detail-meta" id="detailMeta"></div>
    </div>
    <div class="content-area">
      <h3>📝 更新内容</h3>
      <div id="detailText" style="font-size: 15px; line-height: 1.6;"></div>
      <div class="empty-text" id="emptyTextHint">暂无文字内容</div>
      <div class="empty-img" id="emptyImgHint">暂无图片</div>
    </div>
    
    <!-- 详情页底部操作区 -->
    <div class="detail-edit-form">
      <h4>✏️ 编辑工艺信息 (管理员)</h4>
      <div class="form-row">
        <div class="form-group">
          <label>工艺名 (重命名)</label>
          <input type="text" id="detailEditName">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>版本号</label>
          <input type="text" id="detailEditVersion">
        </div>
        <div class="form-group">
          <label>更新日期</label>
          <input type="date" id="detailEditDate">
        </div>
      </div>
      <button class="btn-save-detail" onclick="saveDetailInfo()">💾 保存修改</button>
      <button class="btn-secondary" onclick="exportDataJson()" style="margin-top:10px;">⬇️ 导出 data.json</button>
    </div>
  </div>
</div>

<!-- 后台管理面板 -->
<div id="adminPanel">
  <h2>后台管理 <span class="close" onclick="closeAdmin()">×</span></h2>
  <div id="adminContent">
    <div class="form-group">
      <label>更新提示窗口（天）</label>
      <input type="number" id="windowInput" value="7">
    </div>
    <div class="form-group">
      <label>选择工艺厂</label>
      <select id="adminFactorySelect" onchange="refreshAdminProcessSelect()"></select>
    </div>
    <div class="form-group">
      <label>选择工艺</label>
      <select id="adminProcessSelect"></select>
    </div>
    
    <div class="grid-2">
      <button class="btn-primary" onclick="addProcess()">+ 新增工艺</button>
      <button class="btn-danger" onclick="deleteProcess()">删除当前工艺</button>
      <button class="btn-primary" onclick="addFactory()">+ 新增工艺厂</button>
      <button class="btn-danger" onclick="deleteFactory()">删除当前厂</button>
    </div>
    
    <div style="margin-top:20px; border-top:1px solid #eee; padding-top:15px;">
      <h4 style="margin-bottom:10px; color:#555;">操作日志</h4>
      <ul id="logsList" style="list-style:none; font-size:12px; color:#666; max-height:150px; overflow-y:auto;"></ul>
      <button class="btn-secondary" onclick="clearLogs()" style="background:#ffeb3b; color:#333;">🧹 清空日志</button>
    </div>
  </div>
</div>

<script>
const DEFAULT_DATA = {
  "CSMC": [{"id":"CSMC001","version":"1.0","updateDate":"2026-09-05","detail":{"text":"","images":[]}}],
  "Dongbu": [{"id":"Dongbu001","version":"1.0","updateDate":"2026-09-05","detail":{"text":"","images":[]}}],
  "HHGRACE": [{"id":"BD090GHFH7","version":"1.0","updateDate":"2026-09-05","detail":{"text":"","images":[]}}],
  "ZenSEMI": [{"id":"12in_150nm_5V_BCDE","version":"3.0","updateDate":"2026-09-05","detail":{"text":"","images":[]}}]
};

let DATA = JSON.parse(JSON.stringify(DEFAULT_DATA));
let LOGS = [];
let currentFactory = "";
let currentProcessId = "";

function loadData() {
  fetch('data.json').then(r => r.json()).then(d => {
    DATA = d;
    renderFactoryFilter();
    renderList();
  }).catch(e => {
    document.getElementById('alertBanner').style.display = 'flex';
    renderFactoryFilter();
    renderList();
  });
}

function renderFactoryFilter() {
  const sel = document.getElementById('factoryFilter');
  sel.innerHTML = '<option value="">选择工艺厂</option>' + Object.keys(DATA).map(f => `<option value="${f}">${f}</option>`).join('');
}

function renderList() {
  const factory = document.getElementById('factoryFilter').value;
  const kw = document.getElementById('searchInput').value.toLowerCase();
  const container = document.getElementById('listContainer');
  let html = '';
  
  Object.keys(DATA).forEach(f => {
    if (factory && factory !== f) return;
    DATA[f].forEach(p => {
      if (kw && !p.id.toLowerCase().includes(kw)) return;
      const isNew = (new Date().getTime() - new Date(p.updateDate).getTime()) / (1000 * 60 * 60 * 24) <= 7;
      html += `
        <div class="process-item">
          <div class="name" title="${p.id}">${p.id}</div>
          <div class="info">
            <span>版本：${p.version}</span>
            <span>更新：${p.updateDate}</span>
            ${isNew ? '<span class="badge-new">7日内有更新</span>' : ''}
          </div>
          <div class="actions">
            <button class="btn-view" onclick="viewDetail('${f}', '${p.id}')">查看</button>
          </div>
        </div>
      `;
    });
  });
  container.innerHTML = html || '<div style="padding:20px;text-align:center;color:#999;">无数据</div>';
}

function filterData() { renderList(); }
function resetFilter() {
  document.getElementById('factoryFilter').value = '';
  document.getElementById('searchInput').value = '';
  renderList();
}

// 详情页逻辑
function viewDetail(factory, id) {
  currentFactory = factory;
  currentProcessId = id;
  const p = DATA[factory].find(x => x.id === id);
  if(!p) return;
  
  document.getElementById('listView').style.display = 'none';
  document.getElementById('detailView').style.display = 'block';
  
  document.getElementById('detailTitle').innerText = p.id;
  const isNew = (new Date().getTime() - new Date(p.updateDate).getTime()) / (1000 * 60 * 60 * 24) <= 7;
  document.getElementById('detailMeta').innerHTML = `
    <span>工艺厂：${factory}</span>
    <span>版本：${p.version}</span>
    <span>更新日期：${p.updateDate}</span>
    ${isNew ? '<span class="badge-new">7日内有更新，更新日期 '+p.updateDate+'</span>' : ''}
  `;
  
  document.getElementById('detailText').innerText = p.detail.text;
  document.getElementById('emptyTextHint').style.display = p.detail.text ? 'none' : 'block';
  document.getElementById('emptyImgHint').style.display = (p.detail.images && p.detail.images.length > 0) ? 'none' : 'block';
  
  // 填充底部编辑表单
  document.getElementById('detailEditName').value = p.id;
  document.getElementById('detailEditVersion').value = p.version;
  document.getElementById('detailEditDate').value = p.updateDate;
}

function backToList() {
  document.getElementById('listView').style.display = 'block';
  document.getElementById('detailView').style.display = 'none';
  renderList();
}

// 详情页保存修改逻辑
function saveDetailInfo() {
  const newName = document.getElementById('detailEditName').value.trim();
  const newVersion = document.getElementById('detailEditVersion').value.trim();
  const newDate = document.getElementById('detailEditDate').value;
  
  if(!newName || !newVersion || !newDate) {
    return alert('❌ 工艺名、版本号和日期不能为空！');
  }
  
  const idx = DATA[currentFactory].findIndex(x => x.id === currentProcessId);
  if(idx === -1) return;
  
  // 检查重名
  if(newName !== currentProcessId && DATA[currentFactory].some((p, i) => i !== idx && p.id === newName)) {
    return alert('❌ 该工艺名已存在！');
  }
  
  DATA[currentFactory][idx].id = newName;
  DATA[currentFactory][idx].version = newVersion;
  DATA[currentFactory][idx].updateDate = newDate;
  
  addLog('更新工艺信息', `${currentFactory} / ${currentProcessId} -> ${newName} (v${newVersion})`);
  
  // 刷新视图
  currentProcessId = newName;
  viewDetail(currentFactory, newName);
  alert('✅ 已保存（本地）。请点击“导出 data.json”并上传至 GitHub！');
}

// 后台管理逻辑
function openAdmin() {
  document.getElementById('adminPanel').style.display = 'block';
  refreshAdminFactorySelect();
}
function closeAdmin() { document.getElementById('adminPanel').style.display = 'none'; }

function refreshAdminFactorySelect() {
  const sel = document.getElementById('adminFactorySelect');
  sel.innerHTML = Object.keys(DATA).map(f => `<option value="${f}">${f}</option>`).join('');
  refreshAdminProcessSelect();
}
function refreshAdminProcessSelect() {
  const factory = document.getElementById('adminFactorySelect').value;
  const sel = document.getElementById('adminProcessSelect');
  if(!factory) return;
  sel.innerHTML = DATA[factory].map((p, i) => `<option value="${i}">${p.id} (v${p.version}, ${p.updateDate})</option>`).join('');
}

function addLog(action, detail) {
  LOGS.unshift({ time: new Date().toLocaleString(), action, detail });
  renderLogs();
}

// 重命名逻辑 (保留在JS中供后台增删使用)
function renameProcess() {
  const factory = document.getElementById('adminFactorySelect').value;
  const idx = document.getElementById('adminProcessSelect').value;
  if(!DATA[factory] || !DATA[factory][idx]) return alert('请先选择要重命名的工艺！');
  const oldId = DATA[factory][idx].id;
  const newId = prompt('请输入新的工艺名：', oldId);
  if(!newId || !newId.trim()) return;
  const trimmed = newId.trim();
  if(DATA[factory].some((p,i) => i != idx && p.id === trimmed)) return alert('❌ 该工艺名已存在！');
  
  DATA[factory][idx].id = trimmed;
  addLog('重命名工艺', `${factory}：${oldId} -> ${trimmed}`);
  refreshAdminProcessSelect();
  renderList();
  alert('✅ 工艺已重命名（本地）。请导出 data.json 并上传！');
}

function renameFactory() {
  const oldFactory = document.getElementById('adminFactorySelect').value;
  if(!oldFactory) return alert('请先选择要重命名的工艺厂！');
  const newFactory = prompt('请输入新的工艺厂名：', oldFactory);
  if(!newFactory || !newFactory.trim()) return;
  const trimmed = newFactory.trim();
  if(DATA.hasOwnProperty(trimmed)) return alert('❌ 该工艺厂名已存在！');
  
  DATA[trimmed] = DATA[oldFactory];
  delete DATA[oldFactory];
  addLog('重命名工艺厂', `${oldFactory} -> ${trimmed}`);
  refreshAdminFactorySelect();
  renderFactoryFilter();
  renderList();
  alert('✅ 工艺厂已重命名（本地）。请导出 data.json 并上传！');
}

function addProcess() {
  const factory = document.getElementById('adminFactorySelect').value;
  if(!factory) return alert('请先选择工艺厂！');
  const id = prompt('请输入新工艺名：');
  if(!id || !id.trim()) return;
  if(DATA[factory].some(p => p.id === id.trim())) return alert('❌ 该工艺已存在！');
  
  DATA[factory].push({ id: id.trim(), version: '1.0', updateDate: new Date().toISOString().slice(0,10), detail: { text: '', images: [] } });
  addLog('新增工艺', `${factory} / ${id.trim()}`);
  refreshAdminProcessSelect();
  renderList();
}

function deleteProcess() {
  const factory = document.getElementById('adminFactorySelect').value;
  const idx = document.getElementById('adminProcessSelect').value;
  if(!factory || idx === null) return;
  if(!confirm('确定删除该工艺？')) return;
  
  const removed = DATA[factory].splice(idx, 1)[0];
  addLog('删除工艺', `${factory} / ${removed.id}`);
  refreshAdminProcessSelect();
  renderList();
}

function addFactory() {
  const name = prompt('请输入新工艺厂名：');
  if(!name || !name.trim()) return;
  if(DATA.hasOwnProperty(name.trim())) return alert('❌ 该工艺厂已存在！');
  
  DATA[name.trim()] = [];
  addLog('新增工艺厂', name.trim());
  refreshAdminFactorySelect();
  renderFactoryFilter();
}

function deleteFactory() {
  const factory = document.getElementById('adminFactorySelect').value;
  if(!factory) return;
  if(!confirm(`确定删除工艺厂「${factory}」及其全部工艺？`)) return;
  
  delete DATA[factory];
  addLog('删除工艺厂', factory);
  refreshAdminFactorySelect();
  renderFactoryFilter();
  renderList();
}

function clearLogs() {
  if(!confirm('确定清空全部操作日志？')) return;
  LOGS = [];
  renderLogs();
}

function renderLogs() {
  const ul = document.getElementById('logsList');
  if(!ul) return;
  ul.innerHTML = LOGS.length === 0 ? '<li style="color:#bbb">暂无操作日志</li>' : LOGS.slice(0, 50).map(l => `<li>[${l.time}] ${l.action}：${l.detail}</li>`).join('');
}

function exportDataJson() {
  const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'data.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  alert('✅ 已导出 data.json！\n请将其上传覆盖到 GitHub 仓库根目录，Netlify 会自动重新部署。');
}

loadData();
</script>
</body>
</html>
