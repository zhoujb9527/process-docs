<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>力芯文档与脚本管理系统</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #f5f5f5; color: #333; }
  .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
  .page { display: none; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  .page.active { display: block; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .title { font-size: 24px; font-weight: bold; }
  .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
  .btn-gray { background: #e0e0e0; color: #333; }
  .btn-blue { background: #1976d2; color: #fff; }
  .btn-green { background: #2e7d32; color: #fff; }
  .search-input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 10px; }
  .category-title { font-size: 18px; margin: 15px 0 10px; color: #1976d2; display: flex; align-items: center; }
  .count-badge { font-size: 14px; color: #1976d2; margin-left: 10px; }
  .item-row { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; align-items: center; }
  .item-row:hover { background: #f9f9f9; }
  .new-badge { background: #ffcdd2; color: #c62828; padding: 2px 8px; border-radius: 12px; font-size: 12px; margin-left: 8px; }
  .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; }
  .modal-content { background: #fff; padding: 20px; border-radius: 8px; width: 500px; max-width: 90%; max-height: 90vh; overflow-y: auto; }
  .modal-content h2 { margin-bottom: 15px; }
  .modal-content label { display: block; margin-top: 10px; font-weight: bold; }
  .modal-content input[type="text"], .modal-content input[type="date"], .modal-content textarea { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; }
  .modal-content textarea { min-height: 80px; }
  .modal-actions { margin-top: 20px; display: flex; gap: 10px; }
  .drop-zone { border: 2px dashed #ccc; padding: 20px; text-align: center; margin-top: 10px; border-radius: 4px; cursor: pointer; transition: all 0.3s; background: #fafafa; }
  .drop-zone:hover, .drop-zone.dragover { border-color: #1976d2; background: #e3f2fd; }
  .img-preview { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 5px; }
  .img-preview img, .img-preview video { max-width: 100px; max-height: 100px; border-radius: 4px; object-fit: cover; }
  .img-preview .media-item { position: relative; }
  .img-preview .remove-btn { position: absolute; top: -5px; right: -5px; background: red; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; font-size: 12px; line-height: 20px; padding: 0; }
  .detail-media { max-width: 150px; max-height: 150px; margin: 5px 5px 5px 0; border-radius: 4px; object-fit: cover; }
  .combobox { position: relative; }
  .combobox-dropdown { display: none; position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid #ccc; border-radius: 4px; max-height: 200px; overflow-y: auto; z-index: 100; }
  .combobox-dropdown div { padding: 10px; cursor: pointer; }
  .combobox-dropdown div:hover { background: #f0f0f0; }
  .browser-warning { text-align: center; color: #888; margin-top: 20px; font-size: 12px; }
</style>
</head>
<body>
<div class="container">
  <div class="page active" id="homePage">
    <div class="header">
      <div class="title">力芯管理系统</div>
    </div>
    <button class="btn btn-blue" onclick="showPage('processPage')">📁 工艺文档</button>
    <button class="btn btn-blue" onclick="showPage('skillPage')">💻 Skill脚本</button>
  </div>

  <div class="page" id="processPage">
    <div class="header">
      <button class="btn btn-gray" onclick="showPage('homePage')">← 返回首页</button>
      <div class="title">力芯工艺文档更新</div>
      <button class="btn btn-blue" id="adminBtn" onclick="toggleAdminDropdown('process')">🛠 管理员</button>
    </div>
    <div class="combobox">
      <input type="text" class="search-input" id="factoryInput" placeholder="输入或选择 fab 厂（留空显示全部）">
      <div class="combobox-dropdown" id="factoryDropdown"></div>
    </div>
    <div class="combobox">
      <input type="text" class="search-input" id="processInput" placeholder="输入或选择工艺名（留空显示全部）">
      <div class="combobox-dropdown" id="processDropdown"></div>
    </div>
    <div id="processList"></div>
  </div>

  <div class="page" id="skillPage">
    <div class="header">
      <button class="btn btn-gray" onclick="showPage('homePage')">← 返回首页</button>
      <div class="title">力芯Skill脚本更新</div>
      <button class="btn btn-blue" id="adminBtn" onclick="toggleAdminDropdown('skill')">🛠 管理员</button>
    </div>
    <div class="combobox">
      <input type="text" class="search-input" id="skillInput" placeholder="输入或选择分类（线路/版图）">
      <div class="combobox-dropdown" id="skillDropdown"></div>
    </div>
    <div id="skillList"></div>
  </div>

  <div class="page" id="detailPage">
    <div class="header">
      <button class="btn btn-gray" onclick="goBack()">← 返回</button>
      <div class="title" id="detailTitle"></div>
      <div></div>
    </div>
    <div id="detailContent" style="font-size: 16px; line-height: 1.6;"></div>
  </div>
</div>

<div class="modal" id="adminDropdown">
  <div class="modal-content" style="width: 200px;">
    <button class="btn btn-blue" style="width: 100%; margin-bottom: 5px;" onclick="document.getElementById('manageBtn').click()">管理</button>
    <button class="btn btn-blue" style="width: 100%; margin-bottom: 5px;" onclick="openChangePwd()">修改密码</button>
    <button class="btn btn-blue" style="width: 100%; margin-bottom: 5px;" onclick="openGithubConfig()">GitHub配置</button>
    <button class="btn btn-green" style="width: 100%; margin-bottom: 5px;" onclick="pushToGithub()">☁️ 保存到云端</button>
    <button class="btn btn-gray" style="width: 100%;" onclick="exportDataJson()">⬇️ 导出数据</button>
    <button class="btn btn-gray" style="width: 100%; margin-top: 5px;" onclick="document.getElementById('adminDropdown').style.display='none'">关闭</button>
  </div>
</div>

<div class="modal" id="adminLoginModal">
  <div class="modal-content">
    <h2>管理员登录</h2>
    <input type="password" id="adminPwd" placeholder="请输入管理员密码" style="width: 100%; padding: 8px; margin: 10px 0;">
    <div class="modal-actions">
      <button class="btn btn-blue" onclick="login()">登录</button>
      <button class="btn btn-gray" onclick="closeAdminLogin()">取消</button>
    </div>
  </div>
</div>

<div class="modal" id="changePwdModal">
  <div class="modal-content">
    <h2>修改密码</h2>
    <label>旧密码</label><input type="password" id="oldPwd">
    <label>新密码</label><input type="password" id="newPwd">
    <div class="modal-actions">
      <button class="btn btn-blue" onclick="changePwd()">保存</button>
      <button class="btn btn-gray" onclick="document.getElementById('changePwdModal').style.display='none'">取消</button>
    </div>
  </div>
</div>

<div class="modal" id="processManageModal">
  <div class="modal-content">
    <h2>🛠 管理工艺/厂</h2>
    <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
      <select id="factorySelect" style="padding: 8px;" onchange="renderProcessPage()"></select>
      <select id="processSelect" style="padding: 8px; min-width: 200px;"></select>
      <button class="btn btn-blue" onclick="addProcess()">✨ 新增工艺</button>
      <button class="btn btn-blue" onclick="deleteProcess()">🗑 删除工艺</button>
      <button class="btn btn-blue" onclick="renameProcess()">✏️ 重命名工艺</button>
      <button class="btn btn-blue" onclick="renameFactory()">🏭 重命名厂</button>
      <button class="btn btn-blue" onclick="deleteFactory()">🏭🗑 删除厂</button>
    </div>
    <div class="modal-actions"><button class="btn btn-gray" onclick="document.getElementById('processManageModal').style.display='none'">关闭</button></div>
  </div>
</div>

<div class="modal" id="skillManageModal">
  <div class="modal-content">
    <h2>🛠 管理脚本</h2>
    <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
      <select id="skillCategorySelect" style="padding: 8px;" onchange="updateSkillSelect()">
        <option value="line">线路</option>
        <option value="layout">版图</option>
      </select>
      <select id="skillSelect" style="padding: 8px; min-width: 200px;"></select>
      <button class="btn btn-blue" onclick="addSkill()">✨ 新增脚本</button>
      <button class="btn btn-blue" onclick="deleteSkill()">🗑 删除脚本</button>
      <button class="btn btn-blue" onclick="renameSkill()">✏️ 重命名脚本</button>
    </div>
    <div class="modal-actions"><button class="btn btn-gray" onclick="document.getElementById('skillManageModal').style.display='none'">关闭</button></div>
  </div>
</div>

<div class="modal" id="detailEditModal">
  <div class="modal-content">
    <h2>✏️ 编辑详情</h2>
    <label>名称</label><input type="text" id="editName">
    <label id="editVersionLabel">版本号</label><input type="text" id="editVersion">
    <label>更新日期</label><input type="date" id="editDate">
    <label>文字内容</label><textarea id="editText"></textarea>
    <label>图片/视频</label>
    <div class="drop-zone" id="dropZone">
      📥 点击选择，或拖拽到这里<br>支持 jpg / png / gif / webp / mp4 / webm
      <input type="file" id="fileInput" multiple accept="image/*,video/*" style="display:none">
    </div>
    <div class="img-preview" id="imgPreview"></div>
    <div class="modal-actions">
      <button class="btn btn-green" onclick="saveEdit()">保存</button>
      <button class="btn btn-gray" onclick="document.getElementById('detailEditModal').style.display='none'">取消</button>
    </div>
  </div>
</div>

<div class="modal" id="logModal">
  <div class="modal-content">
    <h2>📝 更新日志</h2>
    <div id="logList" style="max-height: 300px; overflow-y: auto;"></div>
    <div class="modal-actions"><button class="btn btn-gray" onclick="document.getElementById('logModal').style.display='none'">关闭</button></div>
  </div>
</div>

<div class="modal" id="githubConfigModal">
  <div class="modal-content">
    <h2>⚙️ GitHub 配置</h2>
    <label>Personal Access Token</label>
    <input type="password" id="githubToken" placeholder="ghp_... 或 github_pat_...">
    <label>仓库分支</label>
    <input type="text" id="githubBranch" value="main">
    <div class="modal-actions">
      <button class="btn btn-blue" onclick="saveGithubConfig()">保存</button>
      <button class="btn btn-gray" onclick="document.getElementById('githubConfigModal').style.display='none'">取消</button>
    </div>
  </div>
</div>

<div class="browser-warning">For demonstration and testing purposes only.</div>

<script>
let currentModule = '';
let isAdmin = false;
let tempImages = [];
let detailTarget = {};

let PROCESS_DATA = {};
let processAdminPwd = '123456';
let processLogs = [];

let SKILL_DATA = { line: [], layout: [] };
let skillAdminPwd = '123456';
let skillLogs = [];

function showPage(pageId) {
  ['homePage', 'processPage', 'skillPage', 'detailPage'].forEach(id => {
    document.getElementById(id).style.display = id === pageId ? 'block' : 'none';
  });
  
  if (pageId === 'processPage') {
    currentModule = 'process';
    renderProcessPage();
  } else if (pageId === 'skillPage') {
    currentModule = 'skill';
    renderSkillPage();
  }
}

function goBack() {
  if (currentModule === 'process') showPage('processPage');
  else if (currentModule === 'skill') showPage('skillPage');
  else showPage('homePage');
}

// ==================== 渲染 ====================
function renderProcessPage() {
  const facFilter = document.getElementById('factoryInput').value.trim();
  const proFilter = document.getElementById('processInput').value.trim();
  const list = document.getElementById('processList');
  list.innerHTML = '';
  
  Object.keys(PROCESS_DATA).forEach(factory => {
    if (facFilter && !factory.includes(facFilter)) return;
    let items = PROCESS_DATA[factory].filter(p => !proFilter || p.id.includes(proFilter));
    if (items.length === 0) return;
    
    list.innerHTML += `<div class="category-title">${factory} <span class="count-badge">${items.length} 项</span></div>`;
    items.sort((a,b) => a.id.localeCompare(b.id, 'zh-CN', {numeric:true}));
    items.forEach(p => {
      const isNew = (new Date() - new Date(p.updateDate)) / (1000 * 60 * 60 * 24) <= 7;
      const bgClass = isNew ? 'style="background:#fffbe6;"' : '';
      list.innerHTML += `<div class="item-row" ${bgClass} onclick="showDetail('process', {factory: '${factory}', id: '${p.id}'})"><span>${p.id}</span><span>PDK版本:${p.version} 更新:${p.updateDate}${isNew ? ' <span class="new-badge">7日内</span>' : ''}</span></div>`;
    });
  });
}

function renderSkillPage() {
  const filter = document.getElementById('skillInput').value.trim();
  const list = document.getElementById('skillList');
  list.innerHTML = '';
  
  Object.keys(SKILL_DATA).forEach(catKey => {
    const catName = catKey === 'line' ? '线路' : '版图';
    let items = SKILL_DATA[catKey].filter(s => !filter || s.id.includes(filter) || catName.includes(filter));
    if (items.length === 0) return;
    
    list.innerHTML += `<div class="category-title">${catName} <span class="count-badge">${items.length} 项</span></div>`;
    items.sort((a,b) => a.id.localeCompare(b.id, 'zh-CN', {numeric:true}));
    items.forEach(s => {
      const isNew = (new Date() - new Date(s.updateDate)) / (1000 * 60 * 60 * 24) <= 7;
      const bgClass = isNew ? 'style="background:#fffbe6;"' : '';
      list.innerHTML += `<div class="item-row" ${bgClass} onclick="showDetail('skill', {category: '${catKey}', id: '${s.id}'})"><span>${s.id}</span><span>load路径:${s.version} 更新:${s.updateDate}${isNew ? ' <span class="new-badge">7日内</span>' : ''}</span></div>`;
    });
  });
}

// ==================== 详情页 ====================
function showDetail(module, target) {
  detailTarget = { module, ...target };
  let item;
  if (module === 'process') item = PROCESS_DATA[target.factory].find(x => x.id === target.id);
  else item = SKILL_DATA[target.category].find(x => x.id === target.id);
  
  document.getElementById('detailTitle').textContent = item.id;
  const versionLabel = module === 'process' ? 'PDK版本' : 'load路径';
  
  let mediaHtml = '';
  if (item.detail?.images && item.detail.images.length > 0) {
    item.detail.images.forEach(src => {
      if (src.startsWith('data:video')) {
        // 需求一：浏览时图片和视频不可点击放大（移除了 onclick 事件）
        mediaHtml += `<video src="${src}" class="detail-media" controls preload="metadata"></video>`;
      } else {
        mediaHtml += `<img src="${src}" class="detail-media">`;
      }
    });
  }
  
  document.getElementById('detailContent').innerHTML = `
    <p><strong>${versionLabel}：</strong>${item.version} | <strong>更新日期：</strong>${item.updateDate}</p>
    <p style="margin-top: 15px;">${item.detail?.text || ''}</p>
    <div style="margin-top: 15px;">${mediaHtml}</div>
  `;
  
  showPage('detailPage');
}

function openDetailEdit() {
  if (!isAdmin) { alert('请先登录管理员！'); return; }
  const t = detailTarget;
  let item;
  if (t.module === 'process') item = PROCESS_DATA[t.factory].find(x => x.id === t.id);
  else item = SKILL_DATA[t.catKey].find(x => x.id === t.id);
  
  const versionLabel = t.module === 'process' ? 'PDK版本' : 'load路径';
  document.getElementById('editVersionLabel').textContent = versionLabel;
  
  document.getElementById('editName').value = item.id;
  document.getElementById('editVersion').value = item.version;
  document.getElementById('editDate').value = item.updateDate;
  document.getElementById('editText').value = item.detail?.text || '';
  tempImages = item.detail?.images || [];
  renderImgPreview();
  document.getElementById('detailEditModal').style.display = 'flex';
}

function saveEdit() {
  if (!isAdmin) return;
  const t = detailTarget;
  let item;
  if (t.module === 'process') item = PROCESS_DATA[t.factory].find(x => x.id === t.id);
  else item = SKILL_DATA[t.catKey].find(x => x.id === t.id);
  
  item.id = document.getElementById('editName').value.trim();
  item.version = document.getElementById('editVersion').value.trim();
  item.updateDate = document.getElementById('editDate').value;
  item.detail = { text: document.getElementById('editText').value, images: tempImages };
  
  const now = new Date();
  const timeStr = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  
  if (t.module === 'process') {
    processLogs.unshift({ time: timeStr, process: item.id, factory: t.factory });
  } else {
    skillLogs.unshift({ time: timeStr, process: item.id, category: t.catKey });
  }
  
  document.getElementById('detailEditModal').style.display = 'none';
  alert('已保存。可点击"☁️ 保存到云端"同步！');
  goBack();
}

// ==================== 管理员 ====================
function toggleAdminDropdown(module) {
  if (isAdmin) {
    const dd = document.getElementById('adminDropdown');
    dd.style.display = dd.style.display === 'block' ? 'none' : 'block';
    document.getElementById('manageBtn').innerText = module === 'process' ? '🛠 管理工艺/厂' : '🛠 管理脚本';
    document.getElementById('manageBtn').onclick = module === 'process' ? openProcessManage : openSkillManage;
  } else {
    document.getElementById('adminLoginModal').style.display = 'flex';
  }
}

function closeAdminLogin() {
  document.getElementById('adminLoginModal').style.display = 'none';
  document.getElementById('adminPwd').value = '';
}

function login() {
  const pwd = document.getElementById('adminPwd').value;
  const validPwd = currentModule === 'process' ? processAdminPwd : skillAdminPwd;
  if (pwd === validPwd) {
    isAdmin = true;
    document.getElementById('adminLoginModal').style.display = 'none';
    document.getElementById('adminDropdown').style.display = 'block';
  } else {
    alert('密码错误！');
  }
  document.getElementById('adminPwd').value = '';
}

function openChangePwd() {
  document.getElementById('changePwdModal').style.display = 'flex';
  document.getElementById('adminDropdown').style.display = 'none';
}

function changePwd() {
  const oldP = document.getElementById('oldPwd').value;
  const newP = document.getElementById('newPwd').value;
  const validPwd = currentModule === 'process' ? processAdminPwd : skillAdminPwd;
  if (oldP === validPwd && newP) {
    if (currentModule === 'process') processAdminPwd = newP; else skillAdminPwd = newP;
    isAdmin = false;
    document.getElementById('changePwdModal').style.display = 'none';
    alert('密码修改成功！请记得保存到云端。');
  } else {
    alert('旧密码错误或新密码为空！');
  }
  document.getElementById('oldPwd').value = '';
  document.getElementById('newPwd').value = '';
}

// 工艺管理
function openProcessManage() {
  const fs = document.getElementById('factorySelect');
  fs.innerHTML = Object.keys(PROCESS_DATA).sort().map(f => `<option value="${f}">${f}</option>`).join('');
  const factory = fs.value;
  const ps = document.getElementById('processSelect');
  let processes = PROCESS_DATA[factory] || [];
  processes.sort((a,b) => a.id.localeCompare(b.id, 'zh-CN', {numeric:true}));
  ps.innerHTML = processes.map((p,i) => `<option value="${i}">${p.id}</option>`).join('');
  document.getElementById('processManageModal').style.display = 'flex';
  document.getElementById('adminDropdown').style.display = 'none';
}

function addProcess() {
  const factory = document.getElementById('factorySelect').value;
  const id = prompt('新工艺名：');
  if (id?.trim()) { PROCESS_DATA[factory].push({id: id.trim(), version:'1.0', updateDate: new Date().toISOString().slice(0,10), detail:{text:'',images:[]}}); renderProcessPage(); }
}
function deleteProcess() {
  const factory = document.getElementById('factorySelect').value;
  const idx = document.getElementById('processSelect').value;
  if (confirm('确定删除？')) { PROCESS_DATA[factory].splice(idx,1); renderProcessPage(); }
}
function renameProcess() {
  const factory = document.getElementById('factorySelect').value;
  const idx = document.getElementById('processSelect').value;
  const newId = prompt('新工艺名：', PROCESS_DATA[factory][idx].id);
  if (newId?.trim()) { PROCESS_DATA[factory][idx].id = newId.trim(); renderProcessPage(); }
}
function renameFactory() {
  const oldF = document.getElementById('factorySelect').value;
  const newF = prompt('新厂名：', oldF);
  if (newF?.trim() && newF !== oldF) { PROCESS_DATA[newF.trim()] = PROCESS_DATA[oldF]; delete PROCESS_DATA[oldF]; renderProcessPage(); }
}
function deleteFactory() {
  const factory = document.getElementById('factorySelect').value;
  if (confirm(`删除厂 "${factory}"？`)) { delete PROCESS_DATA[factory]; renderProcessPage(); }
}

// 脚本管理
function openSkillManage() {
  updateSkillSelect();
  document.getElementById('skillManageModal').style.display = 'flex';
  document.getElementById('adminDropdown').style.display = 'none';
}

function updateSkillSelect() {
  const cat = document.getElementById('skillCategorySelect').value;
  const ss = document.getElementById('skillSelect');
  let scripts = SKILL_DATA[cat] || [];
  scripts.sort((a,b) => a.id.localeCompare(b.id, 'zh-CN', {numeric:true}));
  ss.innerHTML = scripts.map((s,i) => `<option value="${i}">${s.id}</option>`).join('') || '<option value="">（无脚本）</option>';
}

function addSkill() {
  const cat = document.getElementById('skillCategorySelect').value;
  const id = prompt('新脚本名：');
  if (id?.trim()) {
    SKILL_DATA[cat].push({id: id.trim(), version:'1.0', updateDate: new Date().toISOString().slice(0,10), detail:{text:'',images:[]}});
    updateSkillSelect();
    renderSkillPage();
  }
}
function deleteSkill() {
  const cat = document.getElementById('skillCategorySelect').value;
  const idx = document.getElementById('skillSelect').value;
  if (confirm('确定删除？')) { SKILL_DATA[cat].splice(idx,1); updateSkillSelect(); renderSkillPage(); }
}
function renameSkill() {
  const cat = document.getElementById('skillCategorySelect').value;
  const idx = document.getElementById('skillSelect').value;

// 推送
async function pushToGithub() {
  if (!isAdmin) { alert('请先登录！'); return; }
  const token = localStorage.getItem('github_token');
  if (!token) { alert('请先配置 Token！'); return; }
  
  const owner = 'zhoujb9527', repo = 'process-docs';
  const branch = localStorage.getItem('github_branch') || 'main';
  const path = currentModule === 'process' ? 'data.json' : 'skill-data.json';
  const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
  
  const exportData = currentModule === 'process' 
    ? { ...PROCESS_DATA, _admin_pwd: processAdminPwd, _logs: processLogs }
    : { ...SKILL_DATA, _admin_pwd: skillAdminPwd, _logs: skillLogs };
  
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 10000);
  
  try {
    let sha = '';
    const getRes = await fetch(apiUrl, { headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' }, signal: ctrl.signal });
    if (getRes.ok) sha = (await getRes.json()).sha || '';
    
    const content = JSON.stringify(exportData, null, 2);
    const base64 = btoa(unescape(encodeURIComponent(content)));
    const putRes = await fetch(apiUrl, {
      method: 'PUT', headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: `更新 ${path}`, content: base64, sha, branch }), signal: ctrl.signal
    });
    if (putRes.ok) alert('✅ 推送成功！稍后自动部署。');
    else throw new Error(`HTTP ${putRes.status}`);
  } catch(e) {
    alert('❌ 推送失败：' + e.message);
  } finally {
    clearTimeout(timer);
    document.getElementById('adminDropdown').style.display = 'none';
  }
}

function exportDataJson() {
  const data = currentModule === 'process' ? { ...PROCESS_DATA, _admin_pwd: processAdminPwd, _logs: processLogs } : { ...SKILL_DATA, _admin_pwd: skillAdminPwd, _logs: skillLogs };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = currentModule === 'process' ? 'data.json' : 'skill-data.json';
  a.click(); URL.revokeObjectURL(url);
}

// ==================== 图片/视频上传（点击+拖拽） ====================
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');

dropZone.addEventListener('click', () => fileInput.click());

// 需求二：支持处理视频文件
function handleFiles(files) {
  Array.from(files).forEach(f => {
    if (!f.type.startsWith('image/') && !f.type.startsWith('video/')) return;
    const r = new FileReader();
    r.onload = ev => { tempImages.push(ev.target.result); renderImgPreview(); };
    r.readAsDataURL(f);
  });
}

fileInput.addEventListener('change', e => {
  handleFiles(e.target.files);
  e.target.value = '';
});

['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
  dropZone.addEventListener(eventName, e => { e.preventDefault(); e.stopPropagation(); }, false);
});

['dragenter', 'dragover'].forEach(eventName => {
  dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
});

['dragleave', 'drop'].forEach(eventName => {
  dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
});

dropZone.addEventListener('drop', e => {
  if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
});

// 需求二：预览时区分图片和视频，视频带播放控件
function renderImgPreview() {
  const preview = document.getElementById('imgPreview');
  preview.innerHTML = tempImages.map((src, i) => {
    const isVideo = src.startsWith('data:video');
    const media = isVideo ? `<video src="${src}" controls></video>` : `<img src="${src}">`;
    return `<div class="media-item">${media}<button class="remove-btn" onclick="removeMedia(${i})">×</button></div>`;
  }).join('');
}
