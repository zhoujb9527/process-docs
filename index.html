<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>力芯工艺文档更新</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial; margin: 0; padding: 20px; background: #f5f5f5; }
  .header { max-width: 900px; margin: 0 auto 20px; display: flex; justify-content: space-between; align-items: center; }
  .header h1 { margin: 0; color: #004e8c; }
  .alert { background: #fffbe6; border: 1px solid #ffe58f; padding: 10px 15px; border-radius: 4px; margin-bottom: 20px; color: #ad6800; display: none; }
  .controls { max-width: 900px; margin: 0 auto 20px; background: #fff; padding: 15px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; gap: 10px; align-items: center; }
  select, input { padding: 8px 12px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 14px; }
  button { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
  .btn-primary { background: #1890ff; color: #fff; }
  .btn-secondary { background: #f5f5f5; border: 1px solid #d9d9d9; }
  .btn-danger { background: #ff4d4f; color: #fff; }
  .btn-success { background: #52c41a; color: #fff; }
  .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  .item { border-bottom: 1px solid #e8e8e8; padding: 15px 0; display: flex; justify-content: space-between; align-items: center; }
  .item:last-child { border-bottom: none; }
  .item-name { font-weight: bold; font-size: 16px; color: #333; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-info { display: flex; gap: 15px; align-items: center; }
  .item-info span { color: #666; font-size: 14px; }
  .badge { background: #fff1f0; color: #f5222d; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
  .actions { display: flex; gap: 8px; }
  
  /* 后台管理面板样式 */
  #adminPanel { display: none; position: fixed; top: 0; right: 0; width: 400px; height: 100vh; background: #fff; box-shadow: -2px 0 8px rgba(0,0,0,0.15); padding: 20px; overflow-y: auto; z-index: 1000; }
  #adminPanel h2 { margin-top: 0; display: flex; justify-content: space-between; align-items: center; }
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; margin-bottom: 5px; color: #333; }
  .form-group input, .form-group select { width: 100%; box-sizing: border-box; }
  .btn-block { width: 100%; padding: 10px; margin-bottom: 10px; font-size: 16px; }
  #fileDrop { border: 2px dashed #d9d9d9; padding: 20px; text-align: center; color: #999; cursor: pointer; border-radius: 4px; }
  #fileDrop.dragover { border-color: #1890ff; color: #1890ff; }
  .img-preview { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .img-preview img { width: 80px; height: 80px; object-fit: cover; border-radius: 4px; }
  .hint { color: #faad14; font-size: 12px; margin: 10px 0; }
  .log-item { font-size: 12px; color: #666; border-bottom: 1px solid #eee; padding: 5px 0; }
</style>
</head>
<body>

<div class="header">
  <h1>力芯工艺文档更新</h1>
  <button class="btn-secondary" onclick="openAdminPanel()">⚙️ 后台管理</button>
</div>

<div class="alert" id="alertBanner">
  <span>⚠️ 当前使用的是内嵌默认数据（未成功加载 data.json）。若你已部署到 Netlify，请确认 data.json 与 index.html 在同一目录。</span>
</div>

<div class="controls">
  <select id="factoryFilter"><option value="">选择工艺厂</option></select>
  <input type="text" id="searchInput" placeholder="搜索工艺名...">
  <button class="btn-primary" onclick="filterData()">搜索</button>
  <button class="btn-secondary" onclick="resetFilter()">清空</button>
</div>

<div class="container" id="listContainer">
  <!-- 列表渲染区 -->
</div>

<!-- 后台管理面板 -->
<div id="adminPanel">
  <h2>后台管理 <button class="btn-secondary" onclick="closeAdminPanel()">✕</button></h2>
  
  <div class="form-group">
    <label>更新提示窗口（天）</label>
    <input type="number" id="windowInput" value="7">
  </div>
  
  <div class="form-group">
    <label>选择工艺厂</label>
    <div style="display:flex; gap:10px;">
      <select id="adminFactorySelect" style="flex:1" onchange="refreshAdminProcessSelect()"></select>
      <button class="btn-primary" onclick="addFactory()">+ 新增厂</button>
    </div>
  </div>
  
  <div class="form-group">
    <label>选择工艺</label>
    <select id="adminProcessSelect" style="width:100%"></select>
  </div>
  
  <div class="form-group">
    <label>版本号</label>
    <input type="text" id="versionInput">
  </div>
  
  <div class="form-group">
    <label>更新日期</label>
    <input type="date" id="dateInput">
  </div>
  
  <button class="btn-success btn-block" onclick="saveChanges()">保存修改</button>
  
  <!-- 新增的重命名按钮 -->
  <button class="btn-secondary btn-block" onclick="renameProcess()">✏️ 重命名工艺</button>
  <button class="btn-secondary btn-block" onclick="renameFactory()">✏️ 重命名工艺厂</button>
  
  <div style="display:flex; gap:10px; margin-top:10px;">
    <button class="btn-success" style="flex:1" onclick="addProcess()">+ 新增工艺</button>
    <button class="btn-danger" style="flex:1" onclick="deleteProcess()">删除当前工艺</button>
  </div>
  
  <div style="display:flex; gap:10px; margin-top:10px;">
    <button class="btn-success" style="flex:1" onclick="addFactory()">+ 新增工艺厂</button>
    <button class="btn-danger" style="flex:1" onclick="deleteFactory()">删除当前厂</button>
  </div>
  
  <hr style="margin:20px 0; border:none; border-top:1px solid #eee;">
  
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <strong>操作日志</strong>
    <button class="btn-secondary" style="padding:4px 10px;" onclick="clearLogs()">清空日志</button>
  </div>
  <div id="logsList" style="margin-top:10px; max-height:200px; overflow-y:auto;"></div>
  
  <div class="hint">⚠️ 所有修改仅保存在本地浏览器。修改后请务必点击下方按钮导出并上传 GitHub！</div>
  <button class="btn-primary btn-block" onclick="exportDataJson()">⬇️ 导出 data.json</button>
</div>

<script>
// 默认内嵌数据 (包含之前批量添加的数据)
const DEFAULT_DATA = {
  "CSMC": [{"id":"CSMC001","version":"1.0","updateDate":"2026-09-05","detail":{"text":"","images":[]}}],
  "Dongbu": [{"id":"Dongbu001","version":"1.0","updateDate":"2026-09-05","detail":{"text":"","images":[]}}],
  "SMIC": [{"id":"SMIC001","version":"1.0","updateDate":"2026-09-05","detail":{"text":"","images":[]}}],
  "SKHYNIX": [{"id":"SKHYNIX001","version":"1.0","updateDate":"2026-09-05","detail":{"text":"","images":[]}}],
  "UNT": [{"id":"UNT001","version":"1.0","updateDate":"2026-09-05","detail":{"text":"","images":[]}}],
  "SIEN": [{"id":"SIEN001","version":"1.0","updateDate":"2026-09-05","detail":{"text":"","images":[]}}],
  "IFOUNDRY": [{"id":"IFOUNDRY001","version":"1.0","updateDate":"2026-09-05","detail":{"text":"","images":[]}}],
  "NEXCHIP": [{"id":"NEXCHIP001","version":"1.0","updateDate":"2026-09-05","detail":{"text":"","images":[]}}],
  "ZenSEMI": [{"id":"12in_150nm_5V_BCDE","version":"3.0","updateDate":"2026-09-05","detail":{"text":"","images":[]}}],
  "PSMC": [{"id":"PSMC001","version":"1.0","updateDate":"2026-09-05","detail":{"text":"","images":[]}}],
  "GTA": [{"id":"GTA001","version":"1.0","updateDate":"2026-09-05","detail":{"text":"","images":[]}}],
  "HHGRACE": [{"id":"HHGRACE001","version":"1.0","updateDate":"2026-09-05","detail":{"text":"","images":[]}}]
};

let DATA = JSON.parse(JSON.stringify(DEFAULT_DATA));
let LOGS = [];

// 加载数据
function loadData() {
  fetch('data.json').then(r => r.json()).then(d => {
    DATA = d;
    renderUI();
  }).catch(e => {
    document.getElementById('alertBanner').style.display = 'block';
    renderUI();
  });
}

function renderUI() {
  refreshFactoryFilter();
  refreshAdminFactorySelect();
  filterData();
  renderLogs();
}

// 前台列表渲染与对齐样式
function filterData() {
  const factory = document.getElementById('factoryFilter').value;
  const kw = document.getElementById('searchInput').value.toLowerCase();
  const container = document.getElementById('listContainer');
  let html = '';
  
  Object.keys(DATA).forEach(f => {
    if (factory && factory !== f) return;
    DATA[f].forEach(p => {
      if (kw && !p.id.toLowerCase().includes(kw)) return;
      const days = (new Date().getTime() - new Date(p.updateDate).getTime()) / (1000 * 60 * 60 * 24);
      const isNew = days <= parseInt(document.getElementById('windowInput').value || 7);
      
      html += `
        <div class="item">
          <div class="item-name" title="${p.id}">${p.id}</div>
          <div class="item-info">
            <span>版本：${p.version}</span>
            <span>更新：${p.updateDate}</span>
            ${isNew ? '<span class="badge">7日内有更新</span>' : ''}
            <div class="actions">
              <button class="btn-secondary" onclick="viewDetail('${f}','${p.id}')">查看</button>
              <button class="btn-primary" onclick="openAdminPanel('${f}','${p.id}')">编辑</button>
            </div>
          </div>
        </div>
      `;
    });
  });
  container.innerHTML = html || '<div style="text-align:center;color:#999;padding:20px;">无数据</div>';
}

function refreshFactoryFilter() {
  const sel = document.getElementById('factoryFilter');
  sel.innerHTML = '<option value="">选择工艺厂</option>' + Object.keys(DATA).map(f => `<option value="${f}">${f}</option>`).join('');
}

function refreshAdminFactorySelect() {
  const sel = document.getElementById('adminFactorySelect');
  sel.innerHTML = Object.keys(DATA).map(f => `<option value="${f}">${f}</option>`).join('');
  refreshAdminProcessSelect();
}

function refreshAdminProcessSelect() {
  const factory = document.getElementById('adminFactorySelect').value;
  const sel = document.getElementById('adminProcessSelect');
  if(!factory) { sel.innerHTML = ''; return; }
  sel.innerHTML = DATA[factory].map((p, idx) => `<option value="${idx}">${p.id} (v${p.version}, ${p.updateDate})</option>`).join('');
  loadAdminData();
}

function loadAdminData() {
  const factory = document.getElementById('adminFactorySelect').value;
  const idx = document.getElementById('adminProcessSelect').value;
  if(!factory || idx === null) return;
  const p = DATA[factory][idx];
  if(!p) return;
  document.getElementById('versionInput').value = p.version;
  document.getElementById('dateInput').value = p.updateDate;
}

function openAdminPanel(factory, pid) {
  document.getElementById('adminPanel').style.display = 'block';
  if(factory) {
    document.getElementById('adminFactorySelect').value = factory;
    refreshAdminProcessSelect();
    // 尝试选中特定工艺
    const idx = DATA[factory].findIndex(p => p.id === pid);
    if(idx > -1) document.getElementById('adminProcessSelect').value = idx;
    loadAdminData();
  }
}

function closeAdminPanel() { document.getElementById('adminPanel').style.display = 'none'; }
function viewDetail(factory, id) { alert(`查看详情：${factory} / ${id}\n(此处可扩展详情页)`); }

// 日志
function addLog(action, detail) {
  LOGS.unshift({ time: new Date().toLocaleString(), action, detail });
  if(LOGS.length > 50) LOGS.pop();
  renderLogs();
}
function renderLogs() {
  const ul = document.getElementById('logsList');
  if(!ul) return;
  ul.innerHTML = LOGS.length === 0 ? '<div class="log-item">暂无操作日志</div>' : LOGS.map(l => `<div class="log-item">[${l.time}] ${l.action}：${l.detail}</div>`).join('');
}
function clearLogs() { LOGS = []; renderLogs(); }

// 核心操作逻辑
function saveChanges() {
  const factory = document.getElementById('adminFactorySelect').value;
  const idx = document.getElementById('adminProcessSelect').value;
  if(!factory || idx === null) return alert('请先选择工艺厂和工艺！');
  
  DATA[factory][idx].version = document.getElementById('versionInput').value || '1.0';
  DATA[factory][idx].updateDate = document.getElementById('dateInput').value || new Date().toISOString().slice(0,10);
  
  addLog('修改工艺', `${factory} / ${DATA[factory][idx].id}`);
  filterData();
  refreshAdminProcessSelect();
  alert('✅ 已暂存修改（本地）。请点击底部「⬇️ 导出 data.json」并上传 GitHub！');
}

// 【新增】重命名工艺逻辑
function renameProcess() {
  const factory = document.getElementById('adminFactorySelect').value;
  const idx = document.getElementById('adminProcessSelect').value;
  if(!factory || idx === null) return alert('请先选择要重命名的工艺！');
  
  const oldId = DATA[factory][idx].id;
  const newId = prompt('请输入新的工艺名：', oldId);
  if(!newId || !newId.trim()) return;
  
  if(DATA[factory].some((p, i) => i != idx && p.id === newId.trim())) {
    return alert('❌ 该工艺名已存在！');
  }
  
  DATA[factory][idx].id = newId.trim();
  addLog('重命名工艺', `${factory}：${oldId} -> ${newId.trim()}`);
  refreshAdminProcessSelect();
  filterData();
  alert('✅ 工艺已重命名（本地）。请导出 data.json 并上传！');
}

// 【新增】重命名工艺厂逻辑
function renameFactory() {
  const oldFactory = document.getElementById('adminFactorySelect').value;
  if(!oldFactory) return alert('请先选择要重命名的工艺厂！');
  
  const newFactory = prompt('请输入新的工艺厂名：', oldFactory);
  if(!newFactory || !newFactory.trim()) return;
  
  if(DATA.hasOwnProperty(newFactory.trim())) {
    return alert('❌ 该工艺厂名已存在！');
  }
  
  DATA[newFactory.trim()] = DATA[oldFactory];
  delete DATA[oldFactory];
  
  addLog('重命名工艺厂', `${oldFactory} -> ${newFactory.trim()}`);
  refreshAdminFactorySelect();
  refreshFactoryFilter();
  filterData();
  alert('✅ 工艺厂已重命名（本地）。请导出 data.json 并上传！');
}

function addProcess() {
  const factory = document.getElementById('adminFactorySelect').value;
  if(!factory) return alert('请先选择工艺厂！');
  const id = prompt('请输入新工艺名：');
  if(!id || !id.trim()) return;
  if(DATA[factory].some(p => p.id === id.trim())) return alert('❌ 该工艺已存在！');
  
  DATA[factory].push({ id: id.trim(), version: '1.0', updateDate: new Date().toISOString().slice(0,10), detail: { text: '', images: [] } });
  addLog('新增工艺', `${factory} / ${id.trim()}`);
  refreshAdminProcessSelect();
  filterData();
}

function deleteProcess() {
  const factory = document.getElementById('adminFactorySelect').value;
  const idx = document.getElementById('adminProcessSelect').value;
  if(!factory || idx === null) return;
  if(!confirm('确定删除该工艺？')) return;
  
  const removed = DATA[factory].splice(idx, 1)[0];
  addLog('删除工艺', `${factory} / ${removed.id}`);
  refreshAdminProcessSelect();
  filterData();
}

function addFactory() {
  const name = prompt('请输入新工艺厂名：');
  if(!name || !name.trim()) return;
  if(DATA.hasOwnProperty(name.trim())) return alert('❌ 该工艺厂已存在！');
  
  DATA[name.trim()] = [];
  addLog('新增工艺厂', name.trim());
  refreshAdminFactorySelect();
  refreshFactoryFilter();
}

function deleteFactory() {
  const factory = document.getElementById('adminFactorySelect').value;
  if(!factory) return;
  if(!confirm(`确定删除工艺厂「${factory}」及其全部工艺？`)) return;
  
  delete DATA[factory];
  addLog('删除工艺厂', factory);
  refreshAdminFactorySelect();
  refreshFactoryFilter();
  filterData();
}

// 导出数据
function exportDataJson() {
  const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'data.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  alert('✅ 已导出 data.json！\n请将其上传覆盖到 GitHub 仓库根目录，Netlify 会自动重新部署。');
}

// 初始化
loadData();
</script>
</body>
</html>
